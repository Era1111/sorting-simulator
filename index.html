<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Визуализатор сортировки</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><header><h1>Визуализатор алгоритмов сортировки</h1><p>Сравнивайте элементы, наблюдайте перестановки и изучайте C++.</p></header><section class="panel controls"><label>Массив (2–12 чисел)<input id="numbers" value="8, 3, 6, 1, 9, 4" spellcheck="false"></label><label>Алгоритм<select id="algorithm"><option value="bubble">Сортировка пузырьком</option><option value="selection">Сортировка выбором</option></select></label><label>Порядок<select id="direction"><option value="asc">По возрастанию</option><option value="desc">По убыванию</option></select></label><div class="actions"><button id="apply">Применить</button><button id="random" class="secondary">Случайный массив</button></div><p id="error" role="alert"></p></section><section class="panel"><div class="topline"><h2>Визуализация</h2><span id="progress">Шаг 0 из 0</span></div><div id="bars" class="bars" aria-label="Элементы массива"></div><div class="legend"><span><i class="normal"></i>Обычный</span><span><i class="compare"></i>Сравнение</span><span><i class="sorted"></i>Отсортирован</span></div><div class="actions playback"><button id="prev" class="secondary">← Назад</button><button id="next">Далее →</button><button id="play" class="secondary">▶ Авто</button><button id="end" class="secondary">Результат</button><button id="reset" class="secondary">Сначала</button></div><label class="speed">Скорость анимации <input id="speed" type="range" min="1" max="10" value="5"><output id="speedLabel">5/10</output></label><div id="explanation" class="explanation" aria-live="polite"></div><div class="stats"><div>Сравнения <strong id="comparisons">0</strong></div><div>Перестановки <strong id="swaps">0</strong></div></div></section><section class="panel"><div class="topline"><h2>Код на C++</h2><button id="copy" class="secondary">Копировать код</button></div><p id="algorithmInfo"></p><pre><code id="code"></code></pre></section><footer>Учебный интерактивный тренажёр • Работает без интернета</footer></main><script src="script.js"></script></body></html>
